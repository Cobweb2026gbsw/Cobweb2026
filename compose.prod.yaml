# 공개 웹 호스트에서 실행하는 구성입니다. 채점 워커는 전용 호스트의 compose.worker.yaml로 분리합니다.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cobweb2026
      MYSQL_USER: cobweb
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD required}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/cobweb2026?serverTimezone=UTC
      DB_USERNAME: cobweb
      FLYWAY_ENABLED: 'true'
      JUDGE_ENABLED: 'false'
      PUBLIC_BASE_URL: https://${SITE_DOMAIN:?SITE_DOMAIN required}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
  proxy:
    image: caddy:2
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN required}
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
    restart: unless-stopped
volumes:
  mysql_data:
  caddy_data:
