# 공개 웹 호스트에서 실행하는 구성입니다. 채점 워커는 전용 호스트의 compose.worker.yaml로 분리합니다.
services:
  postgres:
    image: postgres:18
    entrypoint: ["/bin/bash", "/cobweb-init/entrypoint.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_DB: cobweb2026
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD required}
      COBWEB_APP_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/postgres:/cobweb-init:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d cobweb2026"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      # env_file의 DB 관리자 비밀은 앱 프로세스에 상속하지 않습니다.
      POSTGRES_ADMIN_PASSWORD: ''
      DEV_ADMIN_PASSWORD: ''
      DEV_ROOT_PASSWORD: ''
      MYSQL_ROOT_PASSWORD: ''
      DB_URL: jdbc:postgresql://postgres:5432/cobweb2026
      DB_USERNAME: cobweb
      FLYWAY_ENABLED: 'true'
      JUDGE_ENABLED: 'false'
      PUBLIC_BASE_URL: https://${SITE_DOMAIN:?SITE_DOMAIN required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  proxy:
    image: caddy:2
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN required}
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
    restart: unless-stopped
volumes:
  postgres_data:
  caddy_data:
