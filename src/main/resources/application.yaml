spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: cobweb2026
  docker:
    compose:
      enabled: false  # 개발/운영 Compose는 명시적으로 실행하며 앱 기동 시 자동으로 시작하지 않음
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cobweb2026}
    username: ${DB_USERNAME:cobweb}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000
          starttls:
            enable: true
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    # PostgreSQL 신규 DB에는 통합 V1을 적용합니다. 기존 MySQL 데이터는 별도 검증 이관 전까지 보존합니다.
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: false

judge:
  enabled: ${JUDGE_ENABLED:false}
  image: ${JUDGE_IMAGE:cobweb-languages:local}
  workspace: ${JUDGE_WORKSPACE:/tmp/cobweb-judge}

curriculum:
  level0:
    enabled: ${CURRICULUM_LEVEL0_ENABLED:true}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000     # 30분 (ms)
  refresh-token-expiration: 1209600000 # 14일 (ms)

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${PUBLIC_BASE_URL:http://localhost:8080}/api/auth/oauth/google/callback
  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    redirect-uri: ${PUBLIC_BASE_URL:http://localhost:8080}/api/auth/oauth/naver/callback
  github:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
    redirect-uri: ${PUBLIC_BASE_URL:http://localhost:8080}/api/auth/oauth/github/callback
