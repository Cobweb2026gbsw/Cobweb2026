services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cobweb2026
      MYSQL_USER: cobweb
      MYSQL_PASSWORD: ${DEV_DB_PASSWORD:?DEV_DB_PASSWORD를 설정하세요}
      MYSQL_ROOT_PASSWORD: ${DEV_ROOT_PASSWORD:?DEV_ROOT_PASSWORD를 설정하세요}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - cobweb_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  cobweb_mysql:
